<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Nether logo</title>
  <desc id="desc">An original glowing volcanic gateway on a dark background.</desc>
